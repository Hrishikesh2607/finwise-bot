<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finwise — Personal Finance Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #639922; --green-light: #EAF3DE; --green-dark: #27500A;
      --amber: #BA7517; --amber-light: #FAEEDA;
      --red: #E24B4A; --red-light: #FCEBEB;
      --teal: #1D9E75; --teal-light: #E1F5EE;
      --bg: #FFFFFF; --bg2: #F7F6F2; --border: rgba(0,0,0,0.1);
      --txt: #1a1a1a; --muted: #6b6b6b;
      --radius: 12px; --radius-sm: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1c; --bg2: #252525; --border: rgba(255,255,255,0.1);
        --txt: #e8e6e0; --muted: #9a9890;
        --green-light: #1a2e08; --green-dark: #a8d464;
        --amber-light: #2e1f05; --red-light: #2e0d0d; --teal-light: #062418;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg2); color: var(--txt);
      height: 100vh; display: flex; flex-direction: column;
    }

    .nav {
      height: 52px; background: var(--bg);
      border-bottom: 0.5px solid var(--border);
      display: flex; align-items: center;
      padding: 0 20px; gap: 10px; flex-shrink: 0;
    }
    .nav-logo {
      font-size: 18px; font-weight: 600; color: var(--txt);
      letter-spacing: -0.3px;
    }
    .nav-logo span { color: var(--green); }
    .nav-status {
      font-size: 11px; color: var(--teal);
      background: var(--teal-light); padding: 3px 8px;
      border-radius: 20px; margin-left: auto;
    }
    .nav-status.offline { color: var(--red); background: var(--red-light); }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      flex: 1; overflow: hidden;
    }

    .sidebar {
      background: var(--bg); border-right: 0.5px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar-section { padding: 16px; border-bottom: 0.5px solid var(--border); }
    .section-label {
      font-size: 10px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px;
    }

    .budget-item { margin-bottom: 14px; }
    .budget-item:last-child { margin-bottom: 0; }
    .budget-row {
      display: flex; justify-content: space-between;
      align-items: baseline; margin-bottom: 5px;
    }
    .budget-cat { font-size: 13px; color: var(--txt); }
    .budget-amt { font-size: 12px; font-family: monospace; }
    .bar-track {
      height: 5px; background: var(--border);
      border-radius: 3px; overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

    .summary-cards {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .s-card {
      background: var(--bg2); border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .s-val { font-size: 18px; font-weight: 600; color: var(--txt); }
    .s-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .chips { display: flex; flex-direction: column; gap: 6px; padding: 16px; }
    .chip {
      padding: 7px 12px; border-radius: 20px;
      border: 0.5px solid var(--border);
      background: var(--bg2); color: var(--muted);
      font-size: 12px; cursor: pointer;
      transition: all 0.15s; text-align: left;
    }
    .chip:hover {
      border-color: var(--green); color: var(--green-dark);
      background: var(--green-light);
    }

    .chat-area {
      display: flex; flex-direction: column;
      background: var(--bg2);
    }

    .messages {
      flex: 1; overflow-y: auto;
      padding: 20px; display: flex;
      flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }

    .msg { display: flex; gap: 8px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; flex-shrink: 0;
    }
    .msg-avatar.bot { background: var(--green-light); color: var(--green-dark); }
    .msg-avatar.user { background: var(--amber-light); color: var(--amber); }

    .bubble {
      max-width: 72%; padding: 10px 14px;
      border-radius: 16px; font-size: 14px;
      line-height: 1.6; white-space: pre-wrap;
    }
    .msg.bot .bubble {
      background: var(--bg); border: 0.5px solid var(--border);
      border-top-left-radius: 4px; color: var(--txt);
    }
    .msg.user .bubble {
      background: var(--green-light);
      border: 0.5px solid rgba(99,153,34,0.2);
      color: var(--green-dark); border-top-right-radius: 4px;
    }

    .bubble b { font-weight: 600; }

    .typing-dots {
      display: flex; gap: 4px; align-items: center;
      padding: 4px 2px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    .input-bar {
      padding: 14px 16px;
      border-top: 0.5px solid var(--border);
      background: var(--bg);
      display: flex; gap: 10px; align-items: center;
    }
    .chat-input {
      flex: 1; padding: 10px 14px;
      border: 0.5px solid var(--border);
      border-radius: 24px; font-size: 14px;
      background: var(--bg2); color: var(--txt);
      outline: none; transition: border-color 0.15s;
    }
    .chat-input:focus { border-color: var(--green); }
    .chat-input::placeholder { color: var(--muted); }
    .send-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--green); border: none;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: opacity 0.15s; flex-shrink: 0;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 15px; height: 15px; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">fin<span>wise</span></div>
  <div class="nav-status" id="nav-status">Connecting...</div>
</nav>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="section-label">This month</div>
      <div class="summary-cards">
        <div class="s-card">
          <div class="s-val" id="total-spent">—</div>
          <div class="s-lbl">Total spent</div>
        </div>
        <div class="s-card">
          <div class="s-val" id="total-remaining">—</div>
          <div class="s-lbl">Remaining</div>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Budget breakdown</div>
      <div id="budget-bars">
        <div style="color:var(--muted);font-size:12px">Loading...</div>
      </div>
    </div>

    <div class="chips">
      <div class="section-label">Quick questions</div>
      <button class="chip" onclick="sendChip('How much is left for food this month?')">
        How much left for food?
      </button>
      <button class="chip" onclick="sendChip('Am I over budget anywhere?')">
        Am I over budget?
      </button>
      <button class="chip" onclick="sendChip('Show me my spending summary')">
        Monthly summary
      </button>
      <button class="chip" onclick="sendChip('How can I reduce my debt faster?')">
        Debt reduction tips
      </button>
      <button class="chip" onclick="sendChip('How much should I save this month?')">
        Savings advice
      </button>
      <button class="chip" onclick="sendChip('Analyze my spending habits')">
        Spending analysis
      </button>
    </div>
  </aside>

  <!-- ── Chat ── -->
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg bot">
        <div class="msg-avatar bot">F</div>
        <div class="bubble">Hey! I'm <b>Finwise</b>, your personal finance assistant 👋

I can help you track budgets, log expenses, and give savings or debt advice.

Try asking: <b>How much have I spent on food?</b></div>
      </div>
    </div>

    <div class="input-bar">
      <input
        class="chat-input"
        id="chat-input"
        placeholder="Ask about your budget, spending, savings…"
        autocomplete="off"
      />
      <button class="send-btn" id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 15 15" fill="none">
          <path d="M2 7.5h11M9 3l4 4.5L9 12"
            stroke="white" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  const RASA_URL  = "http://localhost:5005/webhooks/rest/webhook";
  const FLASK_URL = "http://localhost:5000";
  const SENDER_ID = "user_" + Math.random().toString(36).slice(2, 8);

  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("chat-input");
  const sendBtn     = document.getElementById("send-btn");
  const statusEl    = document.getElementById("nav-status");

  // ── Utility: render *bold* markdown ──────────────────────────────
  function renderMarkdown(text) {
    return text.replace(/\*(.*?)\*/g, "<b>$1</b>");
  }

  // ── Append a message bubble ───────────────────────────────────────
  function appendMessage(text, role) {
    const div   = document.createElement("div");
    div.className = `msg ${role}`;
    const init  = role === "bot" ? "F" : "U";
    div.innerHTML = `
      <div class="msg-avatar ${role}">${init}</div>
      <div class="bubble">${renderMarkdown(text)}</div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.id = "typing";
    div.innerHTML = `
      <div class="msg-avatar bot">F</div>
      <div class="bubble">
        <div class="typing-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    document.getElementById("typing")?.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    sendBtn.disabled = true;
    appendMessage(text, "user");
    showTyping();

    try {
      const res = await fetch(RASA_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sender: SENDER_ID, message: text }),
      });

      if (!res.ok) throw new Error(`Rasa returned ${res.status}`);

      const responses = await res.json();
      hideTyping();

      if (!responses.length) {
        appendMessage("I didn't quite catch that. Could you rephrase?", "bot");
      } else {
        responses.forEach(r => {
          if (r.text) appendMessage(r.text, "bot");
        });
      }

      loadBudgetSidebar();

    } catch (err) {
      hideTyping();
      appendMessage(
        "⚠️ Can't reach Rasa right now. Make sure it's running on port 5005.",
        "bot"
      );
      console.error("Rasa error:", err);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  function sendChip(text) {
    inputEl.value = text;
    sendMessage();
  }

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  async function loadBudgetSidebar() {
    try {
      const res  = await fetch(`${FLASK_URL}/budget/summary`);
      const data = await res.json();

      document.getElementById("total-spent").textContent =
        "₹" + data.total_spent.toLocaleString("en-IN");

      const remaining = data.total_limit - data.total_spent;
      document.getElementById("total-remaining").textContent =
        "₹" + Math.max(remaining, 0).toLocaleString("en-IN");

      const barsEl = document.getElementById("budget-bars");
      barsEl.innerHTML = "";

      data.categories.forEach(cat => {
        const pct   = Math.min(cat.pct_used, 100);
        const color = cat.over_budget ? "var(--red)"
                    : cat.pct_used >= 80 ? "var(--amber)"
                    : "var(--green)";
        const amtColor = cat.over_budget ? "var(--red)"
                       : cat.pct_used >= 80 ? "var(--amber)"
                       : "var(--muted)";

        barsEl.innerHTML += `
          <div class="budget-item">
            <div class="budget-row">
              <span class="budget-cat">${cat.category}</span>
              <span class="budget-amt" style="color:${amtColor}">
                ₹${cat.spent.toLocaleString("en-IN")} / ₹${cat.limit.toLocaleString("en-IN")}
              </span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%;background:${color}"></div>
            </div>
          </div>`;
      });

      setStatus(true);

    } catch (err) {
      console.warn("Flask sidebar error:", err);
      document.getElementById("budget-bars").innerHTML =
        '<div style="color:var(--muted);font-size:12px">Could not load budget data.</div>';
      setStatus(false);
    }
  }

  async function checkRasaStatus() {
    try {
      const res = await fetch("http://localhost:5005", { method: "GET" });
      setStatus(true);
    } catch {
      setStatus(false);
    }
  }

  function setStatus(online) {
    statusEl.textContent = online ? "● Connected" : "● Offline";
    statusEl.className   = "nav-status" + (online ? "" : " offline");
  }

  loadBudgetSidebar();
  setInterval(loadBudgetSidebar, 30000);
</script>
</body>
</html>
